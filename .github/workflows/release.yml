name: release

on:
  push:
    branches: [main]
    tags: ["v*", "*-win.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Cut a stable release (dev build if none)"
        type: choice
        default: none
        options: [none, patch, minor, major]
      deploy_worker:
        description: "Deploy the release worker even for a branch build"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ (startsWith(github.ref, 'refs/tags/') || inputs.bump != 'none') && 'stable' || 'dev' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && (inputs.bump == '' || inputs.bump == 'none') }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      flip: ${{ steps.v.outputs.flip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          BUMP="${{ inputs.bump }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL=stable
            VERSION="${GITHUB_REF#refs/tags/}"
            REF="$VERSION"
          elif [ -n "$BUMP" ] && [ "$BUMP" != none ]; then
            CHANNEL=stable
            VERSION="$(scripts/next-version.sh "$BUMP")"
            git -c user.name="terminal-browser release" -c user.email="release@zenbu.dev" \
              tag -a "$VERSION" -m "terminal-browser $VERSION"
            git push origin "$VERSION"
            REF="$VERSION"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            CHANNEL=dev
            VERSION="main-$(git rev-parse --short HEAD)"
            REF="$GITHUB_SHA"
          else
            # A branch build publishes a pinned version anyone can install via
            # /install/v/<version>, without moving the dev channel.
            CHANNEL=dev
            FLIP=false
            BRANCH="$(printf %s "${GITHUB_REF#refs/heads/}" | tr -c "a-zA-Z0-9._-" "-")"
            VERSION="$BRANCH-$(git rev-parse --short HEAD)"
            REF="$GITHUB_SHA"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "flip=${FLIP:-true}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: [self-hosted, macOS, ARM64]
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # the self-hosted mac has its toolchains pre-provisioned
      - uses: pnpm/action-setup@v4
        if: matrix.target != 'darwin-arm64'

      - uses: actions/setup-node@v4
        if: matrix.target != 'darwin-arm64'
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'darwin-arm64'

      - run: brew install nasm
        if: matrix.target == 'darwin-x64'

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.channel }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist-release/terminal-browser-${{ matrix.target }}.tar.gz
            dist-release/manifest-${{ matrix.target }}.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: prepare
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
      TERMINAL_BROWSER_AGENT_CACHE: ${{ github.workspace }}/../terminal-browser-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: corepack pnpm install --frozen-lockfile

      - name: Resolve agent-browser version
        id: agent
        shell: pwsh
        run: |
          $ref = node scripts/agent-browser.mjs --ref
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ env.TERMINAL_BROWSER_AGENT_CACHE }}
          key: agent-browser-${{ runner.os }}-${{ steps.agent.outputs.ref }}

      - name: Test
        shell: pwsh
        run: |
          corepack pnpm -r typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm -r test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path engine/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare signing certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $stable = "${{ needs.prepare.outputs.channel }}" -eq "stable"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX)) {
            if ($stable) { throw "stable Windows releases require WINDOWS_CODESIGN_PFX" }
            "WINDOWS_SIGN=false" >> $env:GITHUB_ENV
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "terminal-browser-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX))
            $password = if ([string]::IsNullOrEmpty($env:WINDOWS_CODESIGN_PASSWORD)) {
              New-Object Security.SecureString
            } else {
              ConvertTo-SecureString $env:WINDOWS_CODESIGN_PASSWORD -AsPlainText -Force
            }
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
              Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          if (-not $certificate) { throw "the signing PFX contains no certificate with a private key" }
          "CODESIGN_CERT_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "WINDOWS_SIGN=true" >> $env:GITHUB_ENV

      - name: Build Windows payload and ZIP
        shell: pwsh
        run: |
          $options = @{
            Version = "${{ needs.prepare.outputs.version }}"
            Channel = "${{ needs.prepare.outputs.channel }}"
            Zip = $true
          }
          if ($env:WINDOWS_SIGN -eq "true") { $options.Sign = $true }
          & .\scripts\build-windows.ps1 @options

      - name: Build Windows installer
        shell: pwsh
        run: |
          $options = @{}
          if ($env:WINDOWS_SIGN -eq "true") { $options.Sign = $true }
          & .\scripts\package-windows-inno.ps1 @options

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-win32-x64
          path: |
            dist-release/terminal-browser-win32-x64.zip
            dist-release/manifest-win32-x64.json
            dist-release/terminal-browser-*-windows-x64.exe
            dist-release/manifest-installer-win32-x64.json
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build, windows, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_ORIGIN: ${{ vars.RELEASE_ORIGIN }}
          FLIP_LATEST: ${{ needs.prepare.outputs.flip }}
        run: |
          scripts/publish-r2.sh | tee /tmp/publish.log
          grep -E '^(pinned|latest)=' /tmp/publish.log >> "$GITHUB_OUTPUT" || true

      - uses: actions/download-artifact@v4
        with:
          pattern: windows-release-*
          merge-multiple: true
          path: dist-release

      - name: GitHub release
        if: needs.prepare.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$(printf 'Install on macOS and Linux:\n\n```sh\ncurl -fsSL %s | bash\n```\n\nPinned to this version:\n\n```sh\ncurl -fsSL %s | bash\n```\n\nThe signed Windows installer and portable ZIP are attached below.\n' \
                "${{ steps.publish.outputs.latest }}" "${{ steps.publish.outputs.pinned }}")"
          fi
          gh release upload "$VERSION" \
            dist-release/terminal-browser-*.tar.gz \
            dist-release/terminal-browser-*.zip \
            dist-release/terminal-browser-*.exe \
            --clobber

      - name: Summary
        run: |
          {
            echo "### terminal-browser \`${{ needs.prepare.outputs.version }}\` (${{ needs.prepare.outputs.channel }})"
            echo
            echo "This build:"
            echo '```sh'
            echo "curl -fsSL ${{ steps.publish.outputs.pinned }} | bash"
            echo '```'
            if [ -n "${{ steps.publish.outputs.latest }}" ]; then
              echo "Always current ${{ needs.prepare.outputs.channel }}:"
              echo '```sh'
              echo "curl -fsSL ${{ steps.publish.outputs.latest }} | bash"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  worker:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (inputs.bump != '' && inputs.bump != 'none') || inputs.deploy_worker
        working-directory: release-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler d1 migrations apply terminal-browser-stats --remote
          npx wrangler deploy
