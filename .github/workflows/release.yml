name: Windows CI

on:
  push:
    branches: [windows-native, windows-v0.13.4]
    tags: ["*-win.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
      TERMINAL_BROWSER_AGENT_CACHE: ${{ github.workspace }}/../terminal-browser-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve verification version
        id: version
        shell: pwsh
        run: |
          $commit = git rev-parse --short HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=verify-$commit" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve agent-browser version
        id: agent
        shell: pwsh
        run: |
          $ref = node scripts/agent-browser.mjs --ref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ env.TERMINAL_BROWSER_AGENT_CACHE }}
          key: agent-browser-${{ runner.os }}-${{ steps.agent.outputs.ref }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows payload and ZIP
        shell: pwsh
        run: |
          $options = @{
            Version = "${{ steps.version.outputs.version }}"
            Channel = "dev"
            Zip = $true
          }
          & .\scripts\build-windows.ps1 @options

      - name: Test
        shell: pwsh
        run: |
          cargo test --manifest-path pixel/engine/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm --filter shared build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm -r typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm -r test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        shell: pwsh
        run: |
          & .\scripts\package-windows-inno.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-verification-windows-x64
          path: |
            dist-release/terminal-browser-*-windows-x64.zip
            dist-release/manifest-windows-x64.json
            dist-release/terminal-browser-*-windows-x64.exe
            dist-release/manifest-installer-windows-x64.json
          if-no-files-found: error
