name: Windows CI

on:
  push:
    branches: [main, windows-v0.11.1]
    tags: ["*-win.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
      TERMINAL_BROWSER_AGENT_CACHE: ${{ github.workspace }}/../terminal-browser-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: terminal-browser

      - name: Resolve verification version
        id: version
        shell: pwsh
        working-directory: terminal-browser
        run: |
          $commit = git rev-parse --short HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=verify-$commit" >> $env:GITHUB_OUTPUT

      - name: Read the pixel commit to build against
        id: pixel
        shell: pwsh
        working-directory: terminal-browser
        run: |
          $commit = (Get-Content -LiteralPath pixel.commit -Raw).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw "pixel.commit is not a commit: $commit" }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: fukuyori/pixel
          ref: ${{ steps.pixel.outputs.commit }}
          path: pixel

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: terminal-browser/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            terminal-browser/pnpm-lock.yaml
            pixel/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve agent-browser version
        id: agent
        shell: pwsh
        working-directory: terminal-browser
        run: |
          $ref = node scripts/agent-browser.mjs --ref
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ env.TERMINAL_BROWSER_AGENT_CACHE }}
          key: agent-browser-${{ runner.os }}-${{ steps.agent.outputs.ref }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows payload and ZIP
        shell: pwsh
        working-directory: terminal-browser
        run: |
          $options = @{
            Version = "${{ steps.version.outputs.version }}"
            Channel = "dev"
            Zip = $true
            RequireCleanPixel = $true
          }
          & .\scripts\build-windows.ps1 @options

      - name: Test
        shell: pwsh
        run: |
          Push-Location pixel
          corepack pnpm --filter "@zenbu-labs/pixel" typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm --filter "@zenbu-labs/pixel" test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path engine/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location terminal-browser
          corepack pnpm --filter pixel-store build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm -r typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm -r test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build Windows installer
        shell: pwsh
        working-directory: terminal-browser
        run: |
          & .\scripts\package-windows-inno.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-verification-windows-x64
          path: |
            terminal-browser/dist-release/terminal-browser-*-windows-x64.zip
            terminal-browser/dist-release/manifest-windows-x64.json
            terminal-browser/dist-release/terminal-browser-*-windows-x64.exe
            terminal-browser/dist-release/manifest-installer-windows-x64.json
          if-no-files-found: error
